
name: Testar ISO Windows 11 26H2

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "URL direta da ISO no GitHub Release"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-iso:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Verificar recursos do runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== SISTEMA ==="
          Get-ComputerInfo |
            Select-Object WindowsProductName,
              WindowsVersion, OsArchitecture

          Write-Host "=== ESPACO DISPONIVEL ==="
          Get-PSDrive -Name C |
            Select-Object Name, Used, Free

          Write-Host "=== VIRTUALIZACAO ==="
          Get-CimInstance Win32_Processor |
            Select-Object Name,
              VirtualizationFirmwareEnabled,
              VMMonitorModeExtensions

          Write-Host "=== HYPER-V ==="
          Get-Command Get-VM `
            -ErrorAction SilentlyContinue

      - name: Baixar e verificar ISO
        shell: pwsh
        env:
          ISO_URL: ${{ inputs.iso_url }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:ISO_URL -notmatch '^https://') {
            throw "Informe um URL HTTPS valido."
          }

          $iso = Join-Path $env:RUNNER_TEMP `
            "windows-26h2.iso"

          $drive = Get-PSDrive -Name C
          $freeGB = $drive.Free / 1GB

          Write-Host "Espaco livre: $([math]::Round($freeGB, 2)) GB"

          if ($freeGB -lt 12) {
            throw "Espaco insuficiente para baixar uma ISO grande."
          }

          Write-Host "Baixando ISO..."
          Invoke-WebRequest `
            -Uri $env:ISO_URL `
            -OutFile $iso

          $file = Get-Item $iso

          if ($file.Length -lt 1GB) {
            throw "Arquivo pequeno demais. Verifique o URL."
          }

          Write-Host "Tamanho: $([math]::Round($file.Length / 1GB, 2)) GB"

          $hash = Get-FileHash $iso -Algorithm SHA256
          Write-Host "SHA256: $($hash.Hash)"

          Write-Host "ISO baixada. Isso nao significa que o Windows foi iniciado."
          Write-Host "O runner hospedado nao garante suporte a uma VM Windows aninhada."

      - name: Limpar arquivo temporario
        if: always()
        shell: pwsh
        run: |
          $iso = Join-Path $env:RUNNER_TEMP `
            "windows-26h2.iso"

          if (Test-Path $iso) {
            Remove-Item $iso -Force
            Write-Host "ISO temporaria removida."
          }
          
